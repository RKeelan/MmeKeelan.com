<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="css/styles.css" />
	<link rel="stylesheet" href="css/mathStyles.css" />
	<link rel="stylesheet" href="css/numberLineStyles.css" />
	<meta charset="UTF-8">
	<title>Number Line</title>
</head>
<body class="mw-page">

<div class="mw-editor" id="editor">
	<h1>Number Line — Worksheet Generator</h1>
	<p class="mw-desc">
		Pick an operation, then generate printable pages of problems that add or subtract a single digit, each with a number line spanning twenty to solve it on. The first number is a single digit too, or two digits if you choose.
	</p>

	<div class="mw-row">
		<div class="mw-field">
			<label for="operation">Operation</label>
			<select id="operation">
				<option value="add" selected>Addition</option>
				<option value="subtract">Subtraction</option>
			</select>
		</div>
		<div class="mw-field">
			<label for="count">Problems per page</label>
			<select id="count">
				<option value="4">4</option>
				<option value="5">5</option>
				<option value="6">6</option>
				<option value="7">7</option>
				<option value="8">8</option>
				<option value="9" selected>9</option>
				<option value="10">10</option>
				<option value="11">11</option>
				<option value="12">12</option>
			</select>
		</div>
		<div class="mw-field">
			<label for="pages">Pages</label>
			<input type="number" id="pages" min="1" max="30" step="1" value="1">
		</div>
	</div>

	<label class="mw-check">
		<input type="checkbox" id="two-digit">
		Two-digit first number
	</label>

	<div class="mw-btn-row">
		<button class="mw-btn mw-btn-gen" id="btn-gen">Generate worksheets</button>
		<button class="mw-btn mw-btn-print" id="btn-print" disabled title="Generate worksheets first">Print</button>
	</div>
</div>

<div class="mw-sheet-wrap" id="sheets"></div>

<template id="sheet-template">
	<div class="mw-worksheet">
		<div class="mw-sheet-header">
			<span class="mw-blank">Nom : ______________</span>
			<span class="mw-blank">Date : ______________</span>
		</div>
		<p class="mw-sheet-subtitle"></p>
		<div class="nl-problems"></div>
	</div>
</template>

<script type="module" src="js/number-line.js"></script>
</body>
</html>
