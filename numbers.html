<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Numbers</title>
  <script type="module" crossorigin src="/MmeKeelan.com/assets/numbers-BWI66Y4N.js"></script>
  <link rel="modulepreload" crossorigin href="/MmeKeelan.com/assets/styles-CB5FzGoK.js">
  <link rel="stylesheet" crossorigin href="/MmeKeelan.com/assets/styles-Bv4CGOlD.css">
  <link rel="stylesheet" crossorigin href="/MmeKeelan.com/assets/numbers-CRtsihr0.css">
  <link rel="stylesheet" crossorigin href="/MmeKeelan.com/assets/mathStyles-Cnk_ERjT.css">
</head>
<body class="mw-page">

<div class="mw-editor" id="editor">
	<h1>Numbers — Worksheet Generator</h1>
	<p class="mw-desc">
		Generate printable pages of numbers from 0 to 100 to show three ways: as base-ten blocks, as a numeral, and in words. Each row gives a number in one of the forms you choose, and the student fills in the other two.
	</p>

	<div class="mw-row">
		<div class="mw-field">
			<label for="language">Language</label>
			<select id="language">
				<option value="en" selected>English</option>
				<option value="fr">Français</option>
			</select>
		</div>
		<div class="mw-field">
			<label for="count">Problems per page</label>
			<select id="count">
				<option value="4">4</option>
				<option value="5">5</option>
				<option value="6">6</option>
				<option value="7">7</option>
				<option value="8" selected>8</option>
				<option value="9">9</option>
				<option value="10">10</option>
			</select>
		</div>
		<div class="mw-field">
			<label for="pages">Pages</label>
			<input type="number" id="pages" min="1" max="30" step="1" value="1">
		</div>
	</div>

	<fieldset class="mw-field nb-given">
		<legend>Given as</legend>
		<div class="nb-given-options">
			<label class="mw-check"><input type="checkbox" name="given" value="blocks" checked> Blocks</label>
			<label class="mw-check"><input type="checkbox" name="given" value="numeral" checked> Numeral</label>
			<label class="mw-check"><input type="checkbox" name="given" value="words" checked> Words</label>
		</div>
	</fieldset>

	<label class="mw-check">
		<input type="checkbox" id="ty-teen">
		Only -ty and -teen numbers: 11 to 19, and 20, 30, … 90
	</label>

	<div class="mw-btn-row">
		<button class="mw-btn mw-btn-gen" id="btn-gen">Generate worksheets</button>
		<button class="mw-btn mw-btn-print" id="btn-print" disabled title="Generate worksheets first">Print</button>
	</div>
</div>

<div class="mw-sheet-wrap" id="sheets"></div>

<template id="sheet-template">
	<div class="mw-worksheet">
		<div class="mw-sheet-header">
			<span class="mw-blank nb-name"></span>
			<span class="mw-blank nb-date"></span>
		</div>
		<p class="mw-sheet-subtitle"></p>
		<div class="nb-table"></div>
	</div>
</template>

</body>
</html>
